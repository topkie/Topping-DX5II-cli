[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dx5ii-cli"
version = "0.0.2"
description = "Control a Topping DX5 II over HID: read state, switch output port and EQ preset"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "topkie" }]
keywords = ["topping", "dx5ii", "hid", "equalizer", "audio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["hidapi>=0.14"]

[project.scripts]
dx5ii = "dx5ii.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dx5ii = ["py.typed"]
